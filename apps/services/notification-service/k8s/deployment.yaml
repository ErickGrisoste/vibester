apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
  labels:
    app: notification-service
  annotations:
    prometheus.io/scrape: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: notification-service
          image: ghcr.io/victormarchidev/vibester-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: USER_SERVICE_URL
              value: "http://user-service:3003"
            - name: POST_SERVICE_URL
              value: "http://post-service:3000"
            - name: HTTP_CLIENT_TIMEOUT_MS
              value: "5000"
          envFrom:
            - secretRef:
                name: notification-db-secret
            - secretRef:
                name: smtp-secret
            - configMapRef:
                name: redis-env
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
