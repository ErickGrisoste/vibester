<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Código de Autenticação</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0d0d0d; color: #f5f5f5; padding: 40px;">
  <div style="max-width: 600px; margin: auto; background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center;">
    <h1 style="color: #ffffff; font-size: 28px;">🔒 Código de Autenticação</h1>
    <p style="color: #cccccc; font-size: 16px;">Olá, <strong style="color: #a259ff;">{{name}}</strong>!</p>
    <p style="color: #cccccc; font-size: 16px;">Seu código de verificação é:</p>
    <div style="display: inline-block; padding: 16px 48px; background: linear-gradient(90deg, #a259ff, #6c63ff); font-size: 32px; font-weight: bold; letter-spacing: 10px; color: #ffffff; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 12px rgba(162, 89, 255, 0.4);">
      {{code}}
    </div>
    <p style="font-size: 13px; color: #999;">Este código expira em <strong>5 minutos</strong>. Não compartilhe com ninguém.</p>
  </div>
</body>
</html>
