<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Recuperação de Senha</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0d0d0d; color: #f5f5f5; padding: 40px;">
  <div style="max-width: 600px; margin: auto; background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    <h1 style="color: #ffffff; font-size: 28px; text-align: center;">🔐 Recuperação de Senha</h1>
    <p style="color: #cccccc; font-size: 16px;">Olá, <strong style="color: #a259ff;">{{name}}</strong>!</p>
    <p style="color: #cccccc; font-size: 16px; line-height: 1.7;">Recebemos um pedido para redefinir sua senha no <strong>Vibester</strong>. Clique no botão abaixo para criar uma nova senha:</p>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{resetLink}}" target="_blank" style="display: inline-block; padding: 14px 36px; background: linear-gradient(90deg, #a259ff, #6c63ff); color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 10px; box-shadow: 0 4px 12px rgba(162, 89, 255, 0.4);">
        Redefinir minha senha
      </a>
    </div>
    <p style="font-size: 13px; color: #999; text-align: center;">Se você não solicitou a recuperação de senha, ignore este e-mail.</p>
  </div>
</body>
</html>
