<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Bem-vindo ao Vibester</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0d0d0d; color: #f5f5f5; padding: 40px;">
  <div style="max-width: 600px; margin: auto; background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center;">
    <h1 style="color: #ffffff; font-size: 28px;">🎉 Bem-vindo ao Vibester!</h1>
    <p style="color: #cccccc; font-size: 16px;">Olá, <strong style="color: #a259ff;">{{name}}</strong>!</p>
    <p style="color: #cccccc; font-size: 16px; line-height: 1.7;">Sua conta foi criada com sucesso. Agora você faz parte da maior comunidade de vida noturna e entretenimento!</p>
    <p style="color: #cccccc; font-size: 16px;">Explore eventos, descubra estabelecimentos e conecte-se com outras pessoas.</p>
    <div style="margin-top: 30px;">
      <a href="{{platformLink}}" target="_blank" style="display: inline-block; padding: 14px 36px; background: linear-gradient(90deg, #a259ff, #6c63ff); color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 10px; box-shadow: 0 4px 12px rgba(162, 89, 255, 0.4);">
        Acessar o Vibester
      </a>
    </div>
  </div>
</body>
</html>
