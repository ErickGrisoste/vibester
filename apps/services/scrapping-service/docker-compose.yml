version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: scrapping_db
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
      TZ: $TZ
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Kafka próprio para desenvolvimento local, acessível a partir do host (não só
  # de outros containers) — necessário porque o job/scripts deste serviço rodam
  # via `npx tsx`/`npm run dev` diretamente na máquina, não dentro de um container.
  # ADVERTISED_LISTENERS aponta para "localhost", diferente do Kafka usado pelo
  # feed-service (que advertises "kafka", só resolvível de dentro da rede Docker).
  # Porta do host é 19092 (não 9092) porque 9092 no Windows/Docker Desktop mostrou
  # port-forwarding cruzado com outro broker Kafka já usado no monorepo (metadata
  # retornava nodeId/tópicos de outro serviço) — 19092 evita esse conflito.
  kafka:
    image: apache/kafka:3.9.1
    container_name: scrapping_kafka
    restart: always
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@scrapping_kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

volumes:
  pgdata: