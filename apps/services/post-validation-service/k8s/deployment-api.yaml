apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-validation-service-api
  namespace: default
  labels:
    app: post-validation-service-api
spec:
  # Sem `replicas` de propósito: quem decide é o HPA (k8s/hpa.yaml). Como o CI
  # faz `kubectl apply` a cada deploy, um `replicas: 1` aqui derrubaria as
  # réplicas que o HPA tivesse subido — justamente no momento de carga em que
  # elas existem. Na criação, o padrão do Kubernetes já é 1.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: post-validation-service-api
  template:
    metadata:
      labels:
        app: post-validation-service-api
      # Anotações no template do POD (não no metadata do Deployment): é o que o
      # job `kubernetes-pods` do monitoring/prometheus.yml lê para descobrir o
      # alvo. Sem isto, validation_issues_total e validations_total nunca chegam ao Prometheus e a calibragem da blocklist fica cega.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3008"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: post-validation-service-api
          image: ghcr.io/victormarchidev/vibester-post-validation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3008
          envFrom:
            - secretRef:
                name: post-validation-service-secret
            - configMapRef:
                name: redis-env
          env:
            - name: SERVICE_MODE
              value: "api"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # /health e /ready apontam para endpoints DIFERENTES. O /ready deste
          # serviço nunca devolve 503: nenhuma dependência é crítica na api
          # (sem Redis ele valida igual, só recalculando), e tirar o pod de
          # rotação por causa do cache deixaria a validação indisponível por uma
          # dependência opcional. Alerte em cima da métrica, não do probe.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3008
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
