name: interaction-service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/services/interaction-service/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibester-interaction-service

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/interaction-service/package-lock.json

      # npm ci (e não npm install): instala exatamente o que está no lockfile, o
      # que evita o bug do arborist ao reresolver os peers opcionais do vitest.
      - name: Install dependencies
        working-directory: apps/services/interaction-service
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        working-directory: apps/services/interaction-service
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/interaction-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/interaction-service
        run: npm ci --legacy-peer-deps

      # Testes de rota (mockados, sem infra) — validam auth, validação e os probes.
      - name: Run mocked route tests
        working-directory: apps/services/interaction-service
        run: npx vitest run --config vitest.config.ts

      - name: Start test services (Cassandra)
        working-directory: apps/services/interaction-service
        run: docker compose -f docker-compose.test.yml up -d --wait
        timeout-minutes: 5

      - name: Build
        working-directory: apps/services/interaction-service
        run: npm run build

      - name: Run migrations
        working-directory: apps/services/interaction-service
        run: npm run migrate
        env:
          ASTRA_KEYSPACE: interaction_service_test
          CASSANDRA_CONTACT_POINTS: 127.0.0.1
          CASSANDRA_LOCAL_DATA_CENTER: datacenter1

      # Estes falam com Cassandra de verdade: é o que prova TTL, idempotência e
      # bucket de partição — nenhum teste mockado cobre isso.
      - name: Run real integration tests
        working-directory: apps/services/interaction-service
        run: npm run test:integration
        env:
          ASTRA_KEYSPACE: interaction_service_test
          CASSANDRA_CONTACT_POINTS: 127.0.0.1
          CASSANDRA_LOCAL_DATA_CENTER: datacenter1
          KAFKA_BROKERS: localhost:9092
          JWT_SECRET: test-jwt-secret

      - name: Stop test services
        if: always()
        working-directory: apps/services/interaction-service
        run: docker compose -f docker-compose.test.yml down -v

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner casing
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibester-interaction-service" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/services/interaction-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Normalize image owner casing
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # A mesma imagem vai para os dois Deployments. O worker primeiro: é ele que
      # aplica as migrations, então a API nova nunca sobe contra um schema antigo.
      - name: Deploy worker
        run: |
          kubectl set image deployment/interaction-service-worker \
            interaction-service-worker=ghcr.io/${{ env.OWNER_LC }}/vibester-interaction-service:${{ github.sha }}
          kubectl rollout status deployment/interaction-service-worker --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=interaction-service-worker
            echo "--- Pod logs ---"
            kubectl logs -l app=interaction-service-worker --tail=100 --previous 2>/dev/null || kubectl logs -l app=interaction-service-worker --tail=100
            exit 1
          }

      - name: Deploy api
        run: |
          kubectl set image deployment/interaction-service-api \
            interaction-service-api=ghcr.io/${{ env.OWNER_LC }}/vibester-interaction-service:${{ github.sha }}
          kubectl rollout status deployment/interaction-service-api --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=interaction-service-api
            echo "--- Pod logs ---"
            kubectl logs -l app=interaction-service-api --tail=100 --previous 2>/dev/null || kubectl logs -l app=interaction-service-api --tail=100
            exit 1
          }
