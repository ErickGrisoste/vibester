name: feed-service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/services/feed-service/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibester-feed-service

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/feed-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/feed-service
        run: npm install

      - name: Run unit tests
        working-directory: apps/services/feed-service
        run: npx vitest run tests/unit

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    env:
      # Aponta o driver cassandra-driver para o Cassandra local do docker-compose.test.yml
      # em vez do Astra Cloud (usado em produção) — ver src/config/cassandra.ts.
      CASSANDRA_CONTACT_POINTS: localhost
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      ASTRA_KEYSPACE: feed_keyspace
      JWT_SECRET: ci-test-secret
      KAFKA_BROKERS: localhost:9092

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/feed-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/feed-service
        run: npm install

      - name: Start test services (Cassandra)
        working-directory: apps/services/feed-service
        run: docker compose -f docker-compose.test.yml up -d --wait
        timeout-minutes: 5

      - name: Create Cassandra keyspace
        working-directory: apps/services/feed-service
        run: >
          docker compose -f docker-compose.test.yml exec -T cassandra-test
          cqlsh -e "CREATE KEYSPACE IF NOT EXISTS feed_keyspace WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"

      - name: Pre-create schema_migrations table
        working-directory: apps/services/feed-service
        # scripts/migrate.ts checks feed_keyspace.schema_migrations for every migration file's
        # version BEFORE running that file — including V000_create_table_schema_migrations.cql,
        # the file that creates this very table. That's fine against the long-lived Astra
        # keyspace (the table already exists there), but it means the runner can never bootstrap
        # a truly empty keyspace like this CI job's ephemeral Cassandra. Pre-create the table here
        # (identical DDL to V000) instead of changing the shared migration runner's behavior.
        run: >
          docker compose -f docker-compose.test.yml exec -T cassandra-test
          cqlsh -e "CREATE TABLE IF NOT EXISTS feed_keyspace.schema_migrations (version text PRIMARY KEY, executed_at timestamp);"

      - name: Run Cassandra migrations
        working-directory: apps/services/feed-service
        run: npm run migrate

      - name: Run integration tests
        working-directory: apps/services/feed-service
        run: npm run test:integration

      - name: Stop test services
        if: always()
        working-directory: apps/services/feed-service
        run: docker compose -f docker-compose.test.yml down -v

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner casing
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibester-feed-service" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/services/feed-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Normalize image owner casing
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          kubectl set image deployment/feed-service \
            feed-service=ghcr.io/${{ env.OWNER_LC }}/vibester-feed-service:${{ github.sha }}
          kubectl rollout status deployment/feed-service --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=feed-service
            echo "--- Pod logs ---"
            kubectl logs -l app=feed-service --tail=50 --previous 2>/dev/null || kubectl logs -l app=feed-service --tail=50
            exit 1
          }
