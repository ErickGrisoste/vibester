name: event-service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/services/event-service/**"
      - ".github/workflows/event-service.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibester-event-service

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/services/event-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/event-service
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
        run: npm ci

      - name: Type check
        working-directory: apps/services/event-service
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: apps/services/event-service
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://u:p@localhost:5432/db
        run: npx vitest run src

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: event_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/services/event-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/event-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/event_test_db
        run: npm ci

      - name: Run migrations
        working-directory: apps/services/event-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/event_test_db
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: apps/services/event-service
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/event_test_db
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner casing
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibester-event-service" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/services/event-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Normalize image owner casing
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          kubectl set image deployment/event-service \
            event-service=ghcr.io/${{ env.OWNER_LC }}/vibester-event-service:${{ github.sha }}
          kubectl rollout status deployment/event-service --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=event-service
            echo "--- Pod logs ---"
            kubectl logs -l app=event-service --tail=50 --previous 2>/dev/null || kubectl logs -l app=event-service --tail=50
            exit 1
          }
