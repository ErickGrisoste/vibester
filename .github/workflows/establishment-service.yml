name: establishment-service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/services/establishment-service/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibester-establishment-service

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/services/establishment-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/establishment-service
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          JWT_SECRET: unit-test-secret
          SERP_API_KEY: test
          r2_account_id: test
          r2_access_key_id: test
          r2_secret_access_key: test
          r2_bucket_name: test
          r2_public_url: https://test.r2.dev
        run: npm install

      - name: Run unit tests
        working-directory: apps/services/establishment-service
        run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: establishment_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/services/establishment-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/establishment-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/establishment_test_db
          JWT_SECRET: integration-test-secret-32chars
          SERP_API_KEY: test
          r2_account_id: test
          r2_access_key_id: test
          r2_secret_access_key: test
          r2_bucket_name: test
          r2_public_url: https://test.r2.dev
        run: npm install

      - name: Run migrations
        working-directory: apps/services/establishment-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/establishment_test_db
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: apps/services/establishment-service
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/establishment_test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: integration-test-secret-32chars
          SERP_API_KEY: test
          r2_account_id: test
          r2_access_key_id: test
          r2_secret_access_key: test
          r2_bucket_name: test
          r2_public_url: https://test.r2.dev
        run: npm run test:integration

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner casing
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibester-establishment-service" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/services/establishment-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Normalize image owner casing
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          kubectl apply -f apps/services/establishment-service/k8s/
          kubectl set image deployment/establishment-service \
            establishment-service=ghcr.io/${{ env.OWNER_LC }}/vibester-establishment-service:${{ github.sha }}
          kubectl rollout status deployment/establishment-service --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=establishment-service
            echo "--- Pod logs ---"
            kubectl logs -l app=establishment-service --tail=50 --previous 2>/dev/null || kubectl logs -l app=establishment-service --tail=50
            exit 1
          }
