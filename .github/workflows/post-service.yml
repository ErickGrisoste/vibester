name: post-service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/services/post-service/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibester-post-service

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/post-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/post-service
        run: npm install

      - name: Run unit tests
        working-directory: apps/services/post-service
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/services/post-service/package-lock.json

      - name: Install dependencies
        working-directory: apps/services/post-service
        run: npm install

      - name: Start test services (Redis + Cassandra)
        working-directory: apps/services/post-service
        run: docker compose -f docker-compose.test.yml up -d --wait
        timeout-minutes: 5

      - name: Build
        working-directory: apps/services/post-service
        run: npm run build

      - name: Run migrations
        working-directory: apps/services/post-service
        run: npm run migrate
        env:
          ASTRA_KEYSPACE: post_service_test
          CASSANDRA_CONTACT_POINTS: 127.0.0.1
          CASSANDRA_LOCAL_DATA_CENTER: datacenter1

      - name: Run integration tests
        working-directory: apps/services/post-service
        run: npm run test:integration
        env:
          REDIS_URL: redis://localhost:6379
          ASTRA_KEYSPACE: post_service_test
          CASSANDRA_CONTACT_POINTS: 127.0.0.1
          CASSANDRA_LOCAL_DATA_CENTER: datacenter1
          KAFKA_BROKERS: localhost:9092
          R2_ACCOUNT_ID: test-account
          R2_ACCESS_KEY_ID: test-key
          R2_SECRET_ACCESS_KEY: test-secret
          R2_BUCKET_NAME: test-bucket
          R2_PUBLIC_URL: https://test.r2.dev

      - name: Stop test services
        if: always()
        working-directory: apps/services/post-service
        run: docker compose -f docker-compose.test.yml down -v

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner casing
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vibester-post-service" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/services/post-service
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Normalize image owner casing
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          kubectl set image deployment/post-service \
            post-service=ghcr.io/${{ env.OWNER_LC }}/vibester-post-service:${{ github.sha }}
          kubectl rollout status deployment/post-service --timeout=300s || {
            echo "--- Pod describe ---"
            kubectl describe pod -l app=post-service
            echo "--- Pod logs ---"
            kubectl logs -l app=post-service --tail=100 --previous 2>/dev/null || kubectl logs -l app=post-service --tail=100
            exit 1
          }
